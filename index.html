<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego Patrio - 25 de Mayo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="badge">🇦🇷 Acto del 25 de Mayo</p>
      <h1>Desafío Patrio</h1>
      <p class="subtitle">Respondé preguntas sobre la Revolución de Mayo y sumá puntos por cada respuesta correcta.</p>
    </header>

    <section class="card" id="quiz-card">
      <div class="status-row">
        <p id="progress">Pregunta 1 de 10</p>
        <p id="score">Puntaje: 0</p>
      </div>

      <h2 id="question">Cargando pregunta...</h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>

      <div class="actions">
        <button id="next-btn" class="btn" disabled>Siguiente</button>
        <button id="restart-btn" class="btn btn-secondary" hidden>Volver a jugar</button>
      </div>
    </section>

    <footer class="footer">
      <p>¡Viva la Patria! 💙☀️🤍</p>
    </footer>
  </main>

  <script src="funciones.js"></script>
</body>
</html>
